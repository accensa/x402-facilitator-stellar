version: '3.8'

services:
  facilitator:
    build: .
    ports:
      - '${PORT:-3402}:3402'
    environment:
      - FACILITATOR_SECRET=${FACILITATOR_SECRET}
      - DATABASE_URL=postgres://postgres:postgres@db:5432/x402_facilitator
      # CQRS read replica (#121): status reads and the reconciliation sweep hit
      # db-replica, writes stay on db. Set point read traffic grows without
      # touching the primary that carries settlement submissions.
      - DATABASE_URL_REPLICA=postgres://postgres:postgres@db-replica:5432/x402_facilitator
      - REDIS_URL=redis://redis:6379
      # Redlock quorum (#116): three independent masters.
      - REDIS_NODES=redis://redis-node-1:6379,redis://redis-node-2:6379,redis://redis-node-3:6379
      # Async webhook delivery (#117).
      - KAFKA_BROKERS=kafka:9092
      - PORT=3402
      # Unset by default = per-process memory. Set RATE_LIMIT_STORE=postgres in
      # the environment (or .env) to share limiter state across replicas and
      # keep the daily fee ceiling alive across restarts.
      - RATE_LIMIT_STORE=${RATE_LIMIT_STORE:-memory}
      - AUDIT_LOG_FILE=${AUDIT_LOG_FILE:-}
    depends_on:
      db:
        condition: service_healthy
      db-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
      kafka:
        condition: service_started

  # Single shared Redis for the Redis-backed rate limiter.
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Redlock masters (#116). Independent instances on separate containers so a
  # single failure cannot produce two lock holders; quorum is 2 of 3.
  redis-node-1:
    image: redis:7-alpine
    ports:
      - '6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  redis-node-2:
    image: redis:7-alpine
    ports:
      - '6382:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  redis-node-3:
    image: redis:7-alpine
    ports:
      - '6383:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Kafka in KRaft mode (#117): no ZooKeeper, one broker is enough for local
  # composition; production should run >= 3 across failure domains.
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - '9092:9092'
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/bitnami/kafka

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=x402_facilitator
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Streaming read replica (#121). Production should run >= 2 across failure
  # domains; one node is the correct shape for local composition. It boots by
  # taking a pg_basebackup of the primary, then follows the write-ahead log
  # continuously. Reads from this node are intentionally replicated outside the
  # primary's transaction lifetime, so read-after-write consistency is handled
  # at the application layer (see src/store/postgres.js).
  db-replica:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGPASSWORD=postgres
    ports:
      - '5433:5432'
    command:
      - bash
      - -ec
      - |
        if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
          rm -rf /var/lib/postgresql/data
          pg_basebackup -h db -U postgres -D /var/lib/postgresql/data -Fp -R -X stream
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_replica_data:
  kafka_data:

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: x402-facilitator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: x402-facilitator
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: External
      external:
        metric:
          name: active_verifications
        target:
          type: AverageValue
          averageValue: '5'
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
      selectPolicy: Min

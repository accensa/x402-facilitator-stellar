# Values for prometheus-community/prometheus-adapter.
# Install with:
# helm upgrade --install prometheus-adapter prometheus-community/prometheus-adapter \
#   --namespace monitoring --create-namespace \
#   -f deploy/kubernetes/prometheus-adapter-values.yaml

prometheus:
  url: http://prometheus-operated.monitoring.svc
  port: 9090

rules:
  default: false
  external:
    # Scope discovery to this deployment's own series. Without the service and
    # namespace matchers, any workload anywhere in the cluster that exposes a
    # series named active_verifications would be picked up and the HPA would
    # scale on the cluster-wide sum.
    - seriesQuery: 'active_verifications{namespace!="",service="x402-facilitator"}'
      resources:
        namespaced: false
      name:
        matches: '^active_verifications$'
        as: 'active_verifications'
      metricsQuery: 'sum(<<.Series>>{namespace!="",service="x402-facilitator",<<.LabelMatchers>>}) by (namespace)'

openapi: 3.1.0
info:
  title: x402 Facilitator (Stellar)
  version: 0.0.1
  description: |
    This document describes the **transport** — the HTTP routes in
    `src/app.js` and `src/dlq/routes.js` — and nothing more. It is deliberately silent about what
    makes a payment valid or a settlement succeed: verify/settle semantics
    live in the upstream, Apache-2.0 `@x402/stellar` package
    (`ExactStellarScheme`), and this repo's house rule is that we do not
    reimplement or re-describe them. `paymentPayload` and
    `paymentRequirements` are therefore modeled loosely here — the shape the
    transport itself depends on (object, `scheme` a string, `network` a
    string this instance serves) is required; the contents of
    `paymentPayload.payload` (the transaction XDR and everything inside it)
    are accepted verbatim and are the scheme's to judge, not this document's.

    Two things about status codes are easy to get wrong when modeling this
    service and are called out again on the routes themselves: `POST /verify`
    and `POST /settle` return **200** for a *failed payment* — `isValid:
    false` / `success: false` are values in a 200 body, not 4xx/5xx. A spec
    that models payment failure as an HTTP error status describes a different
    service. 4xx here is reserved for the transport rejecting the request
    itself (a malformed body, an unserved network, a missing/invalid API
    key), which is what request-validation.js and the auth middleware in
    `src/app.js` are responsible for — see #68 and #65's neighboring issue
    #6 for the rejection-reason taxonomy.
  license:
    name: Apache-2.0
    url: https://github.com/accensa/x402-facilitator-stellar/blob/main/LICENSE

servers:
  - url: http://localhost:3402
    description: Local development (testnet, open mode by default)

tags:
  - name: payments
    description: The x402 verify/settle surface, plus settlement status reads.
  - name: discovery
    description: The Bazaar catalog — automatic and manual resource discovery.
  - name: meta
    description: Liveness, readiness, capability advertisement, usage, and metrics.
  - name: ops
    description: |
      Operator dead-letter queue — view, replay, or discard poisoned webhook
      messages. Registered only when a DeadLetterStore is supplied (Postgres
      configured), and always under the strict API-key check.

security:
  - ApiKeyAuth: []

paths:
  /healthz:
    get:
      tags: [meta]
      summary: Liveness check
      description: |
        Liveness only, by design — it reports that the process is up and
        must never consult a dependency (a liveness probe that fails on a
        downstream outage causes restart loops). Readiness — RPC
        connectivity and signer funding per network — is what `GET /readyz`
        reports (#100).
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
              examples:
                default:
                  value: { ok: true }

  /readyz:
    get:
      tags: [meta]
      summary: Readiness check
      description: |
        Whether this instance can actually settle right now (#100), reported
        per network: Soroban RPC reachability plus signer-account funding.
        Catalog-store trouble is reported but never fails readiness — a
        cataloging failure must never fail a payment, and readiness predicts
        payment capability. Answers 503 while unhealthy or shutting down;
        without a configured checker it answers 503 with reason
        `readiness_not_configured`.
      security: []
      responses:
        '200':
          description: Ready to settle on every configured network.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Not ready — see `reason` and the per-network report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /metrics:
    get:
      tags: [meta]
      summary: Prometheus metrics exposition
      description: |
        Operator surface, not API surface: the full Prometheus exposition
        served as `text/plain`. Unauthenticated like the other meta reads.
        When `METRICS_PORT` is set the same exposition is additionally bound
        to a separate loopback listener (`METRICS_HOST`, default
        `127.0.0.1`); either way this document describes the same bytes.
      security: []
      responses:
        '200':
          description: Prometheus text exposition (version 0.0.4).
          content:
            text/plain:
              schema:
                type: string

  /supported:
    get:
      tags: [meta]
      summary: Advertise supported scheme/network pairs and extensions
      description: |
        Always open, even when API keys are configured elsewhere: a client
        must be able to read this before it has any relationship with the
        service. Passed through from `facilitator.getSupported()` untouched,
        including the Stellar-specific `extra` block (`areFeesSponsored`).
      security: []
      responses:
        '200':
          description: Supported kinds, extensions, and signer addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedResponse'
              examples:
                default:
                  value:
                    kinds:
                      - x402Version: 2
                        scheme: exact
                        network: 'stellar:testnet'
                        extra: { areFeesSponsored: true }
                    extensions: ['bazaar']
                    signers: { 'stellar:*': ['GABC...'] }

  /usage:
    get:
      tags: [meta]
      summary: Per-key usage counters
      description: |
        Requires an API key **even in open mode** — usage accounting has no
        meaning for an anonymous caller, so this route refuses with a
        distinct reason (`open_mode_usage_forbidden`) rather than silently
        aggregating across everyone.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Usage counters for the authenticated key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        '401':
          description: |
            Missing/invalid key, or open mode (no keys configured at all —
            `open_mode_usage_forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /verify:
    post:
      tags: [payments]
      summary: Verify a payment without settling it
      description: |
        **Returns HTTP 200 even when the payment is invalid.**
        `isValid: false` with a non-null `invalidReason` is a normal,
        successful response from this endpoint's point of view — the
        transport did its job by reporting the outcome. 4xx here means the
        transport itself rejected the *request* before reaching the scheme
        (malformed body, unserved network) or that a rate limit was hit; it
        never means "payment invalid".
      security:
        - ApiKeyAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: |
            Verification result — check `isValid`, not the status code.
          headers:
            EXTENSION-RESPONSES:
              $ref: '#/components/headers/ExtensionResponses'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
              examples:
                valid:
                  value: { isValid: true }
                invalid:
                  value:
                    isValid: false
                    invalidReason: invalid_exact_stellar_payload_authorization_not_signed
                    invalidMessage: payer signature missing
                    payer: GPAYER...
        '400':
          description: |
            The transport rejected the request body itself — see
            request-validation.js. Reason is one of `invalid_request` (body
            shape) or `unsupported_network` (well-formed body naming a
            network this instance does not serve).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
              examples:
                malformed:
                  value:
                    isValid: false
                    invalidReason: invalid_request
                    invalidMessage: 'paymentPayload must be an object'
                unsupportedNetwork:
                  value:
                    isValid: false
                    invalidReason: unsupported_network
                    invalidMessage: 'network "stellar:pubnet" is not served by this instance (serves: stellar:testnet)'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /settle:
    post:
      tags: [payments]
      summary: Verify and settle a payment on-chain
      description: |
        **Returns HTTP 200 even when settlement fails.** `success: false`
        with a non-null `errorReason` is a normal response; `transaction`
        and `network` are always present, even on failure, so a client can
        attribute the failure without correlating out of band. As with
        `/verify`, 4xx here is the transport rejecting the request itself,
        never a settlement outcome.
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettleRequest'
      responses:
        '200':
          description: |
            Settlement result — check `success`, not the status code.
          headers:
            EXTENSION-RESPONSES:
              $ref: '#/components/headers/ExtensionResponses'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettleResponse'
              examples:
                success:
                  value:
                    success: true
                    transaction: abc123...
                    network: 'stellar:testnet'
                failure:
                  value:
                    success: false
                    errorReason: facilitator_error
                    errorMessage: rpc unreachable
                    transaction: ''
                    network: 'stellar:testnet'
        '400':
          description: |
            The transport rejected the request body itself. Note the
            response shape differs from `/verify`'s 400: `/settle` always
            carries `transaction` and `network`, even in a transport-level
            rejection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettleResponse'
              examples:
                malformed:
                  value:
                    success: false
                    errorReason: invalid_request
                    errorMessage: 'paymentPayload must be an object'
                    transaction: ''
                    network: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /pact/submit:
    post:
      tags: [payments]
      summary: Sponsor a follow-up call on a Pactwright pact
      description: |
        Fee-sponsored submission of one call on the configured Pactwright
        `pact` contract (docs/scheme_pact_stellar.md): `record_verdict`,
        `settle`, `close_meter`, `release` or `extend_pact_ttl`. The caller
        signs any auth the call needs; the facilitator only pays the fee and
        is never a party. Same API keys, rate limits and daily fee budget as
        `/settle`. 404 when no pact contract is configured for the network.
      security:
        - ApiKeyAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PactSubmitRequest'
      responses:
        '200':
          description: Submitted and confirmed on-chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PactSubmitResponse'
        '400':
          description: Rejected (`errorReason` names the rule) or invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PactSubmitResponse'
        '404':
          description: The `pact` scheme is not configured for this network.
        '429':
          description: Rate limited or the daily fee budget is spent.

  /settlements/{idempotencyKey}:
    get:
      tags: [payments]
      summary: Read one settlement by idempotency key
      description: |
        The status read behind `/settle`'s exactly-once key: retrying with
        the same key replays the recorded response instead of settling again.
        Scoped to the caller's key id — a record written under another key
        reads back as 404, indistinguishable from "never existed".
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - name: idempotencyKey
          in: path
          required: true
          description: The key `/settle` derived from the request (explicit header or body hash).
          schema:
            type: string
      responses:
        '200':
          description: The settlement record.
          content:
            application/json:
              schema:
                type: object
                required: [ok, settlement]
                properties:
                  ok:
                    type: boolean
                    const: true
                  settlement:
                    type: object
                    description: |
                      The durable record (`state` one of `submitted`,
                      `settled`, `failed`, `unknown`; `tx_hash`,
                      `error_reason` and `response` as stored).
                    additionalProperties: true
        '404':
          description: No record for this key under this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settlements/{idempotencyKey}/events:
    get:
      tags: [payments]
      summary: Ordered event history for one settlement
      description: |
        The audit trail behind the status read (#130): every state
        transition for the key, oldest first. Same caller scoping as the
        status read itself.
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - name: idempotencyKey
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The event log for the key.
          content:
            application/json:
              schema:
                type: object
                required: [ok, idempotencyKey, events]
                properties:
                  ok:
                    type: boolean
                    const: true
                  idempotencyKey:
                    type: string
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '404':
          description: No record for this key under this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /discovery/resources:
    post:
      tags: [discovery]
      summary: Manually register a resource in the Bazaar catalog
      description: |
        The secondary registration path. The primary one is automatic —
        cataloging off `/verify`/`/settle` for any payment whose payload
        carries the discovery extension, which never blocks or fails the
        payment itself (see `docs/BAZAAR.md`). This route is for a seller
        registering something after the fact, without a fresh payment.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Registered (or soft-dropped fields noted).
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required: [ok, resource, softDrops]
                properties:
                  ok:
                    type: boolean
                    const: true
                  resource:
                    $ref: '#/components/schemas/CatalogResource'
                  softDrops:
                    type: array
                    items:
                      type: string
                    description: |
                      Fields dropped for quality reasons rather than the
                      whole resource — e.g. `routeTemplate` for a wildcard
                      route (#65), `serviceName`, `iconUrl`,
                      `description_truncated`, `tags_filtered`.
        '400':
          description: |
            Hard drop — the resource was rejected outright (invalid
            discovery extension, or a hostile `routeTemplate`: traversal or
            protocol smuggling). See `docs/BAZAAR.md` for the full policy
            table.
          content:
            application/json:
              schema:
                type: object
                required: [error, reason]
                properties:
                  error:
                    type: string
                  reason:
                    type: string
                    enum:
                      - invalid_request
                      - missing_or_invalid_discovery_extension
                      - invalid_extension_schema
                      - invalid_routeTemplate
                      - catalog_error
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

    get:
      tags: [discovery]
      summary: List cataloged resources
      security: []
      parameters:
        - $ref: '#/components/parameters/FilterType'
        - $ref: '#/components/parameters/FilterPayTo'
        - $ref: '#/components/parameters/FilterScheme'
        - $ref: '#/components/parameters/FilterNetwork'
        - $ref: '#/components/parameters/FilterExtensions'
        - name: limit
          in: query
          description: Clamped to [1, 100]; defaults to 20.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of cataloged resources, newest first.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/json:
              schema:
                type: object
                required: [x402Version, items, pagination]
                properties:
                  x402Version:
                    type: integer
                    const: 2
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogResource'
                  pagination:
                    type: object
                    required: [limit, offset, total]
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      total:
                        type: integer
        '304':
          description: |
            The client's `If-None-Match` validator still matches — the page is
            unchanged, and the response carries no body (#200).
        '500':
          $ref: '#/components/responses/InternalError'

  /discovery/search:
    get:
      tags: [discovery]
      summary: Lexical (and, if configured, hybrid semantic) search over the catalog
      security: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Required — a 400 is returned if omitted.
        - $ref: '#/components/parameters/FilterType'
        - $ref: '#/components/parameters/FilterPayTo'
        - $ref: '#/components/parameters/FilterScheme'
        - $ref: '#/components/parameters/FilterNetwork'
        - $ref: '#/components/parameters/FilterExtensions'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Opaque, base64-encoded. Advisory, like `limit` — the server may return fewer results than asked.
          schema:
            type: string
      responses:
        '200':
          description: Ranked search results.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/json:
              schema:
                type: object
                required: [x402Version, resources, partialResults, pagination]
                properties:
                  x402Version:
                    type: integer
                    const: 2
                  resources:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogResource'
                  partialResults:
                    type: boolean
                    description: |
                      True when the backend is degraded — e.g. no embeddings
                      provider configured, or a resource not yet re-embedded.
                      Currently only meaningful for the semantic leg of
                      search; the memory-backed spike has no partitioned
                      backend of its own to degrade.
                  pagination:
                    type: object
                    required: [limit, cursor]
                    properties:
                      limit:
                        type: integer
                      cursor:
                        type: [string, 'null']
                        description: Opaque cursor for the next page, or null if there is none.
        '304':
          description: |
            The client's `If-None-Match` validator still matches — the result
            page is unchanged, and the response carries no body (#200).
        '400':
          description: '`query` was omitted.'
          content:
            application/json:
              schema:
                type: object
                required: [error, reason]
                properties:
                  error:
                    type: string
                    const: invalid_request
                  reason:
                    type: string
        '500':
          $ref: '#/components/responses/InternalError'

  /discovery/resource:
    get:
      tags: [discovery]
      summary: Read a single catalog entry by URL
      description: |
        The point read behind the listing: a caller who knows a resource's
        URL does not have to page the whole catalog to find it (#222).
        Unauthenticated, like the other discovery reads.
      security: []
      parameters:
        - $ref: '#/components/parameters/ResourceUrl'
        - $ref: '#/components/parameters/ResourceToolName'
      responses:
        '200':
          description: The catalog entry.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/json:
              schema:
                type: object
                required: [x402Version, resource]
                properties:
                  x402Version:
                    type: integer
                    const: 2
                  resource:
                    $ref: '#/components/schemas/CatalogResource'
        '304':
          description: |
            The client's `If-None-Match` validator still matches — the entry
            is unchanged, and the response carries no body (#200).
        '400':
          description: '`url` was omitted.'
          content:
            application/json:
              schema:
                type: object
                required: [error, reason]
                properties:
                  error:
                    type: string
                    const: invalid_request
                  reason:
                    type: string
                    const: url is required
        '404':
          description: |
            No public entry matches. Deliberately sent without cache
            headers: a cached "does not exist" would outlive the seller's
            registration.
          content:
            application/json:
              schema:
                type: object
                required: [error, reason]
                properties:
                  error:
                    type: string
                    const: not_found
                  reason:
                    type: string
                    const: resource_not_found
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [discovery]
      summary: Remove a catalog entry
      description: |
        Deletes a listing outright (#221) — the entry, its per-`payTo`
        accounting and its embedding all go, so a later `/verify` re-creates
        it as a fresh provisional listing rather than resurrecting the old
        one. Any valid API key may remove any listing: nothing maps a key to
        a `payTo`, so there is no ownership to enforce. The removal is
        audited as `catalog_delete`.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceUrl'
        - $ref: '#/components/parameters/ResourceToolName'
      responses:
        '200':
          description: Removed.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required: [ok, removed]
                properties:
                  ok:
                    type: boolean
                    const: true
                  removed:
                    type: object
                    required: [url, toolName]
                    properties:
                      url:
                        type: string
                      toolName:
                        type: [string, 'null']
        '400':
          description: '`url` was omitted.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'Nothing matched, so nothing was removed.'
          content:
            application/json:
              schema:
                type: object
                required: [error, reason]
                properties:
                  error:
                    type: string
                    const: not_found
                  reason:
                    type: string
                    const: resource_not_found
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: 'The durable delete failed; `reason` carries the store code.'
          content:
            application/json:
              schema:
                type: object
                required: [error, reason]
                properties:
                  error:
                    type: string
                    const: catalog_error
                  reason:
                    type: string

  /admin/dlq:
    get:
      tags: [ops]
      summary: List dead letters, newest first
      description: |
        Operator API over the dead-letter store (poisoned webhook messages
        whose delivery path exhausted its retry budget). Registered only when
        a `DeadLetterStore` is supplied (Postgres configured). Requires a
        real API key — the strict check, like `/usage`, even in open mode:
        this surface reads in-flight settlement notifications.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, exhausted, resolved, discarded]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A page of dead letters, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [ok, items, pagination]
                properties:
                  ok:
                    type: boolean
                    const: true
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeadLetter'
                  pagination:
                    type: object
                    required: [limit, offset, total]
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      total:
                        type: integer
        '400':
          description: '`status` is not a known dead-letter status (`invalid_status`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
        '401':
          description: |
            Missing/invalid key — the strict check, so this is also the
            answer in open mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /admin/dlq/{id}:
    get:
      tags: [ops]
      summary: Read a single dead letter
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The dead letter.
          content:
            application/json:
              schema:
                type: object
                required: [ok, deadLetter]
                properties:
                  ok:
                    type: boolean
                    const: true
                  deadLetter:
                    $ref: '#/components/schemas/DeadLetter'
        '400':
          description: '`id` is not an integer (`invalid_id`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
        '401':
          description: Missing/invalid key — the strict check, even in open mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: No dead letter with this id (`dead_letter_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
    delete:
      tags: [ops]
      summary: Permanently discard a dead letter
      description: |
        Never retried again after this. Audited as `dlq_discard`.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Discarded.
          content:
            application/json:
              schema:
                type: object
                required: [ok, status]
                properties:
                  ok:
                    type: boolean
                    const: true
                  status:
                    type: string
                    const: discarded
        '400':
          description: '`id` is not an integer (`invalid_id`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
        '401':
          description: Missing/invalid key — the strict check, even in open mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: No dead letter with this id (`dead_letter_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  /admin/dlq/{id}/replay:
    post:
      tags: [ops]
      summary: Attempt immediate redelivery of a dead letter
      description: |
        Runs outside the backoff schedule and resolves synchronously, so
        the operator sees the outcome of the action rather than polling.
        Audited as `dlq_replay`. A discarded or already-resolved letter is
        a 409, not a retry.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Redelivered.
          content:
            application/json:
              schema:
                type: object
                required: [ok, status]
                properties:
                  ok:
                    type: boolean
                    const: true
                  status:
                    type: string
                    const: resolved
        '400':
          description: '`id` is not an integer (`invalid_id`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
        '401':
          description: Missing/invalid key — the strict check, even in open mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: No dead letter with this id (`dead_letter_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: Already terminal (`already_discarded` / `already_resolved`).
          content:
            application/json:
              schema:
                type: object
                required: [error, reason]
                properties:
                  error:
                    type: string
                    const: conflict
                  reason:
                    type: string
                    enum: [already_discarded, already_resolved]
        '502':
          description: Redelivery failed; `error` carries the delivery error.
          content:
            application/json:
              schema:
                type: object
                required: [ok, status]
                properties:
                  ok:
                    type: boolean
                    const: false
                  status:
                    type: string
                    const: redelivery_failed
                  error:
                    type: string

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Two forms are accepted: `Authorization: Bearer <secret>` or
        `Authorization: <secret>` (no scheme prefix). Verified with a
        constant-time comparison against the SHA-256 digests resolved at
        boot from `FACILITATOR_API_KEYS`. If no keys are configured at all,
        the facilitator runs in **open mode** and every route except
        `/usage` is unauthenticated — correct for a free testnet instance,
        strongly discouraged on pubnet. See `docs/AUTHENTICATION.md`.

        `/usage` and the `/admin/dlq` routes require a key even in open mode
        (`open_mode_usage_forbidden` otherwise — the strict check).
        `/healthz`, `/readyz`, `/metrics`, `/supported`, and both
        `GET /discovery/*` routes are always open regardless of mode.

  headers:
    ExtensionResponses:
      description: |
        Base64-encoded JSON, present on `/verify` and `/settle` responses
        whenever the payment carried a discovery extension. Decodes to
        `{"bazaar": {"status": ..., "code": ..., "reason"?: ...}}` — status
        is one of `landed`, `partially landed`, `rejected`, or
        `"not attempted"` (payload carried no/invalid discovery extension).
        See #146 and `docs/BAZAAR.md`.
      schema:
        type: string
        format: byte
    RateLimitLimit:
      description: The caller's limit for the current window.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Unix timestamp (seconds) when the current window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying. Present only on 429 responses.
      schema:
        type: integer
    CacheControl:
      description: |
        Client-side caching policy for the discovery reads (#200):
        `public, max-age=<DISCOVERY_CACHE_MAX_AGE_SECONDS>,
        stale-while-revalidate=<DISCOVERY_CACHE_STALE_SECONDS>`. A client within
        `max-age` reuses its copy without asking; past that it may serve stale
        while revalidating in the background.
      schema:
        type: string
    ETag:
      description: |
        Weak validator for this representation (#200): `W/"<catalogVersion>-<hash>"`.
        The catalog version is a monotonic counter bumped on every catalog write,
        so any write invalidates every cached variant at once; the hash covers the
        full query-parameter set, so different filters never share a validator.
        Send it back as `If-None-Match` to get an empty 304 when unchanged.
      schema:
        type: string
    LastModified:
      description: |
        RFC 1123 timestamp of the most recent catalog write (#200). Informational;
        revalidate with `If-None-Match` (the ETag), not `If-Modified-Since`.
      schema:
        type: string

  parameters:
    ResourceUrl:
      name: url
      in: query
      required: true
      description: The resource's URL, exactly as it appears in the catalog. A 400 is returned if omitted.
      schema:
        type: string
    ResourceToolName:
      name: toolName
      in: query
      required: false
      description: |
        Narrows the lookup to one tool when several share a URL (an MCP
        server exposing more than one tool). Omitted matches the URL's own
        entry.
      schema:
        type: string
    FilterType:
      name: type
      in: query
      schema:
        type: string
        enum: [http, mcp]
    FilterPayTo:
      name: payTo
      in: query
      schema:
        type: string
    FilterScheme:
      name: scheme
      in: query
      schema:
        type: string
    FilterNetwork:
      name: network
      in: query
      schema:
        type: string
    FilterExtensions:
      name: extensions
      in: query
      description: Comma-separated, or repeated. Every named extension must be present on a matching resource.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Makes `/settle` exactly-once per key: retrying with the same key
        replays the recorded response instead of settling again. When absent,
        the key is derived from the request body. Backed by Postgres when
        `DATABASE_URL` is set; process-local otherwise.
      schema:
        type: string

  responses:
    Unauthorized:
      description: |
        Missing, malformed, or unrecognized API key. Reason is one of
        `missing_auth_header`, `malformed_auth_header`, or `invalid_api_key`.
        Not returned at all when the instance is running in open mode.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
    RateLimited:
      description: The caller's rate limit was exceeded for this operation.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            type: object
            required: [error, reason]
            properties:
              error:
                type: string
                const: rate_limited
              reason:
                type: string
                description: |
                  Which limit was hit (e.g. `verify_rpm`, `settle_rpd`,
                  `fee_spd`, `catalog_rpm`). The open set is not finalized —
                  see #6.
    InternalError:
      description: An unexpected server-side failure (e.g. a catalog query error).
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
              message:
                type: string

  schemas:
    AuthError:
      type: object
      required: [error, reason]
      properties:
        error:
          type: string
          const: unauthorized
        reason:
          type: string
          enum:
            - missing_auth_header
            - malformed_auth_header
            - invalid_api_key
            - open_mode_usage_forbidden

    RequestError:
      type: object
      required: [error, reason]
      properties:
        error:
          type: string
          const: invalid_request
        reason:
          type: string

    NotFoundError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          const: not_found
        reason:
          type: string
        message:
          type: string

    ReadinessResponse:
      type: object
      description: |
        Readiness per #100: `ok` is true only when every configured network
        is ready. `networks` maps each network to its RPC-reachability and
        signer-funding checks; catalog state is reported but never fails
        readiness. Without a configured checker the answer is
        `{ok: false, status: 'not_ready', reason:
        'readiness_not_configured'}`.
      required: [ok]
      properties:
        ok:
          type: boolean
        status:
          type: string
        reason:
          type: string
        checked_at:
          type: string
          format: date-time
        networks:
          type: object
          additionalProperties: true
      additionalProperties: true

    DeadLetter:
      type: object
      description: |
        One poisoned webhook message: which delivery path gave up on it
        (`source`), what it carries (`payload`), how many attempts each leg
        made, and where it sits in the retry schedule (`status`, one of
        `pending`, `exhausted`, `resolved`, `discarded`).
      properties:
        id:
          type: integer
        message_id:
          type: string
        source:
          type: string
        type:
          type: string
        payload:
          type: object
          additionalProperties: true
        error:
          type: string
        delivery_attempts:
          type: integer
        dlq_attempts:
          type: integer
        status:
          type: string
          enum: [pending, exhausted, resolved, discarded]
      additionalProperties: true

    SupportedResponse:
      type: object
      required: [kinds, extensions, signers]
      properties:
        kinds:
          type: array
          items:
            type: object
            required: [x402Version, scheme, network]
            properties:
              x402Version:
                type: integer
              scheme:
                type: string
              network:
                type: string
              extra:
                type: object
                description: Scheme-specific capabilities. For Stellar's `exact` scheme, includes `areFeesSponsored`.
                additionalProperties: true
        extensions:
          type: array
          items:
            type: string
        signers:
          type: object
          description: Map of network pattern (e.g. `stellar:*`) to signer addresses.
          additionalProperties:
            type: array
            items:
              type: string

    UsageResponse:
      type: object
      description: |
        Counters for the current window per limit family, keyed by name
        (`verify_rpm`, `settle_rpm`, `settle_rph`, `settle_rpd`, `fee_spd`).
        The exact key set tracks `src/rate-limit.js`'s configured limits.
      additionalProperties:
        type: integer

    PaymentPayload:
      type: object
      description: |
        The spec's payload envelope, accepted verbatim. `payload` (and
        everything inside it, including `payload.transaction`) is passed
        through unwrapped and un-renamed to the upstream scheme — this
        transport does not inspect it. Only presence-and-object-ness is
        required here.
      required: [payload]
      properties:
        x402Version:
          type: integer
        scheme:
          type: string
        network:
          type: string
        resource:
          type: object
          additionalProperties: true
        extensions:
          type: object
          additionalProperties: true
        payload:
          type: object
          description: 'Scheme-specific. For `exact` on Stellar: `{transaction: <XDR>}`. Not validated by the transport.'
          additionalProperties: true
      additionalProperties: true

    PaymentRequirements:
      type: object
      description: |
        Only `scheme` and `network` are checked by the transport itself
        (both required strings; `network` must be one this instance serves —
        see request-validation.js and #68). Everything else is passed
        through to the scheme unvalidated.
      required: [scheme, network]
      properties:
        scheme:
          type: string
        network:
          type: string
          description: A CAIP-2 identifier this instance serves, e.g. `stellar:testnet` or `stellar:pubnet`.
        asset:
          type: string
        maxAmountRequired:
          type: string
        payTo:
          type: string
        maxTimeoutSeconds:
          type: integer
        extra:
          type: object
          additionalProperties: true
      additionalProperties: true

    VerifyRequest:
      type: object
      required: [paymentPayload, paymentRequirements]
      properties:
        paymentPayload:
          $ref: '#/components/schemas/PaymentPayload'
        paymentRequirements:
          $ref: '#/components/schemas/PaymentRequirements'

    SettleRequest:
      $ref: '#/components/schemas/VerifyRequest'

    VerifyResponse:
      type: object
      required: [isValid]
      properties:
        isValid:
          type: boolean
        invalidReason:
          type: [string, 'null']
          description: |
            Non-null whenever `isValid` is false — a null reason anywhere is
            an acceptance failure for this service. Transport-level values
            are `invalid_request` and `unsupported_network`
            (request-validation.js) and `facilitator_error` (an exception
            above the scheme). Everything else is the scheme's own
            vocabulary (e.g. `invalid_exact_stellar_payload_*`) and is
            passed through unmodified — see #6 for the open taxonomy.
        invalidMessage:
          type: string
        payer:
          type: string
      additionalProperties: true

    SettleResponse:
      type: object
      required: [success, transaction, network]
      properties:
        success:
          type: boolean
        errorReason:
          type: [string, 'null']
        errorMessage:
          type: string
        transaction:
          type: string
          description: Empty string, not omitted, when settlement never reached the chain.
        network:
          type: [string, 'null']
        payer:
          type: string
      additionalProperties: true

    PactSubmitRequest:
      type: object
      required: [network, transaction]
      additionalProperties: false
      properties:
        network:
          type: string
          examples: ['stellar:testnet']
        transaction:
          type: string
          description: Base64 XDR transaction with one invokeHostFunction on the pact contract.

    PactSubmitResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        transaction:
          type: string
        network:
          type: string
        function:
          type: string
        feeStroops:
          type: integer
        errorReason:
          type: string
          description: '`invalid_pact_submit_*` or `pact_submit_*` (docs/scheme_pact_stellar.md §6).'
        errorMessage:
          type: string
      additionalProperties: true

    CatalogResource:
      type: object
      description: |
        See `docs/BAZAAR.md` for the identity model (HTTP resources keyed by
        `url`; MCP resources keyed by `(url, toolName)`).
      required: [type, url, scheme, network]
      properties:
        type:
          type: string
          enum: [http, mcp]
        url:
          type: string
        toolName:
          type: string
          description: Present only when `type` is `mcp`.
        serviceName:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        iconUrl:
          type: string
        scheme:
          type: string
        network:
          type: string
        payTo:
          type: string
        extensions:
          type: object
          additionalProperties: true
      additionalProperties: true
